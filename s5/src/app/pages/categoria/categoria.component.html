<!-- *ngIf muestra un mensaje si el slug de la URL no existe -->
<ng-container *ngIf="categoria as actual; else sinCategoria">
  <div class="shell">
    <p class="breadcrumb">
      <a routerLink="/">Tienda</a>
      <span aria-hidden="true">›</span>
      <a routerLink="/categorias">Categorías</a>
      <span aria-hidden="true">›</span>
      {{actual.nombre}}
    </p>

    <div class="category-header">
      <div>
        <span class="eyebrow">COLECCIÓN MESAVERSO</span>
        <h1>{{actual.nombre}}</h1>
        <p>{{actual.descripcion}}</p>
      </div>
      <span class="big-symbol" aria-hidden="true">⚄</span>
    </div>

  <section class="section">
    <div class="catalog-search" role="search">
      <label class="form-label fw-semibold" for="buscarJuego">Buscar en esta categoría</label>
      <input class="form-control" id="buscarJuego" name="buscarJuego" type="search"
        [(ngModel)]="busqueda" placeholder="Escribe parte del nombre" autocomplete="off">
      <p class="search-status" aria-live="polite">{{visibles.length}} de {{totalCategoria}} juegos visibles.</p>
    </div>

    <p *ngIf="aviso" class="notice-demo" role="status">{{aviso}}</p>

    <div class="row g-3 game-grid">
      <!-- Cada juego se dibuja con la misma tarjeta -->
      <div class="col-12 col-md-6 col-lg-4" *ngFor="let juego of visibles">
        <app-juego-tarjeta [juego]="juego" (agregarAlCarrito)="agregar($event)"></app-juego-tarjeta>
      </div>
    </div>
    <p *ngIf="visibles.length === 0" class="empty-state">No se encontraron juegos con ese nombre.</p>
  </section>
  </div>
</ng-container>

<ng-template #sinCategoria>
  <section class="section shell">
    <h1>Categoría inexistente</h1>
    <a routerLink="/">Volver al inicio</a>
  </section>
</ng-template>
