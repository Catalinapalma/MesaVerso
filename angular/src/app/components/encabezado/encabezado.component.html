<header class="site-header">
  <div class="shell header-inner">
    <a routerLink="/" (click)="cerrarMenu()" class="brand" aria-label="MesaVerso, ir al inicio">
      <span class="logo-mark" aria-hidden="true">⚄</span>
      <span>MESAVERSO <small>Tu universo de juegos de mesa</small></span>
    </a>
    <span class="header-aside d-none d-md-inline">UNA MESA. MIL AVENTURAS.</span>
  </div>
</header>

<nav class="navbar navbar-expand-lg top-nav" aria-label="Navegación principal" data-bs-theme="dark">
  <div class="shell nav-inner">
    <span class="navbar-brand d-lg-none">MENÚ</span>
    <button class="navbar-toggler" type="button" (click)="menuAbierto = !menuAbierto"
      [attr.aria-expanded]="menuAbierto" aria-controls="menuPrincipal" aria-label="Abrir o cerrar el menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" [class.show]="menuAbierto" id="menuPrincipal">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" routerLink="/" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" (click)="cerrarMenu()">TIENDA</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/categorias" routerLinkActive="active"
          ariaCurrentWhenActive="page" (click)="cerrarMenu()">CATEGORÍAS</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/ofertas" routerLinkActive="active"
          ariaCurrentWhenActive="page" (click)="cerrarMenu()">OFERTAS</a></li>
      </ul>

      <ul class="navbar-nav">
        <!-- Invitado: aún no inicia sesión -->
        <li class="nav-item" *ngIf="!sesion.activa"><a class="nav-link" routerLink="/login" (click)="cerrarMenu()">INGRESAR</a></li>
        <li class="nav-item" *ngIf="!sesion.activa"><a class="nav-link nav-register" routerLink="/registro" (click)="cerrarMenu()">REGISTRO</a></li>

        <!-- Cliente -->
        <li class="nav-item" *ngIf="sesion.esCliente">
          <a class="nav-link" routerLink="/carrito" (click)="cerrarMenu()">CARRITO<span class="nav-cart-count">{{carrito.cantidad}}</span></a>
        </li>
        <li class="nav-item" *ngIf="sesion.esCliente"><a class="nav-link" routerLink="/historial" (click)="cerrarMenu()">MIS COMPRAS</a></li>

        <!-- Administrador -->
        <li class="nav-item" *ngIf="sesion.esAdmin"><a class="nav-link nav-register" routerLink="/admin" (click)="cerrarMenu()">ADMINISTRAR</a></li>

        <!-- Cualquier sesión iniciada -->
        <li class="nav-item" *ngIf="sesion.activa"><a class="nav-link" routerLink="/perfil" (click)="cerrarMenu()">PERFIL</a></li>
        <li class="nav-item nav-session" *ngIf="sesion.activa">
          <span class="nav-session-name">{{sesion.nombre}}</span>
          <button class="btn-logout" type="button" (click)="salir()">SALIR</button>
        </li>
      </ul>
    </div>
  </div>
</nav>
